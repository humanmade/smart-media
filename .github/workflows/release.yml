name: Release

# Builds the plugin, stamps the version into plugin.php, then creates an
# immutable tag that points at the built, versioned code.
#
# The tag is created once and never moved or force-pushed, which is what
# Packagist requires. Run this manually from the Actions tab, choosing the
# branch to release from (master or a release branch) and the version to cut.
#
# If a run fails after the tag was pushed, run it again with the same version.
# A re-run reuses the existing tag (after checking this workflow made it) and
# only builds the ZIP and publishes the GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading "v" (e.g. 0.5.14)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version input
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in X.Y.Z format without a leading 'v'. Got: '$INPUT_VERSION'"
            exit 1
          fi
          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # The tag exists. Only reuse it if this workflow made it, so a tag
          # pushed by hand is never released.
          if [ "$(git cat-file -t "refs/tags/${VERSION}")" != "tag" ]; then
            echo "::error::Tag ${VERSION} exists but is not an annotated tag, so this workflow did not create it."
            exit 1
          fi

          if [ "$(git log -1 --format=%s "refs/tags/${VERSION}^{commit}")" != "Release ${VERSION}" ]; then
            echo "::error::Tag ${VERSION} exists but its commit is not 'Release ${VERSION}', so this workflow did not create it."
            exit 1
          fi

          TAGGED_PLUGIN="$(git show "${VERSION}:plugin.php")"
          if printf '%s\n' "$TAGGED_PLUGIN" | grep -q '__VERSION__'; then
            echo "::error::Tag ${VERSION} exists but plugin.php still has the __VERSION__ placeholder."
            exit 1
          fi
          if ! printf '%s\n' "$TAGGED_PLUGIN" | grep -Fxq " * Version: ${VERSION}"; then
            echo "::error::Tag ${VERSION} exists but plugin.php has no ' * Version: ${VERSION}' line."
            exit 1
          fi

          # A finished release must not be overwritten.
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            echo "::error::A GitHub release for ${VERSION} already exists. Tags are immutable, so bump the version and try again."
            exit 1
          fi

          echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          echo "::notice::Tag ${VERSION} already exists and was made by this workflow. It will be reused."

      - name: Ensure the changelog has an entry for this version
        if: env.TAG_EXISTS != 'true'
        run: |
          if ! grep -Eq "^## v${VERSION//./\\.}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${VERSION}' heading. Add it on this branch and try again."
            exit 1
          fi

      - name: Set up Node
        if: env.TAG_EXISTS != 'true'
        uses: actions/setup-node@v4
        with:
          # node-sass 4 does not build on newer Node versions.
          node-version: 12
          cache: 'npm'

      - name: Install dependencies and build
        if: env.TAG_EXISTS != 'true'
        run: |
          npm ci
          npm run build

      - name: Stamp version into the plugin
        if: env.TAG_EXISTS != 'true'
        run: |
          if ! grep -q '__VERSION__' plugin.php; then
            echo "::error::plugin.php has no __VERSION__ placeholder to replace."
            exit 1
          fi
          sed -i "s/__VERSION__/${VERSION}/g" plugin.php
          grep -n "Version:" plugin.php

      - name: Create the immutable release commit and tag
        if: env.TAG_EXISTS != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The build output is gitignored in source. Force-add it so the
          # tagged tree is self-contained and ready to install.
          git add -f inc/cropper/build manifest.json
          git add plugin.php
          git commit -m "Release ${VERSION}"

          git tag -a "${VERSION}" -m "Release ${VERSION}"

          # Push only the tag. The release commit never lands on a branch.
          git push origin "refs/tags/${VERSION}"

      - name: Build distribution ZIP
        run: |
          mkdir -p dist
          # git archive honours the export-ignore rules in .gitattributes, so
          # the ZIP matches the tagged tree minus development files.
          git archive --format=zip \
            --prefix=smart-media/ \
            -o "dist/smart-media-${VERSION}.zip" \
            "${VERSION}"

      - name: Write release notes from the changelog
        run: |
          mkdir -p dist
          # Read the changelog from the tag so a re-run does not depend on the
          # branch it was started from.
          ESCAPED_VERSION="${VERSION//./\\.}"
          git show "${VERSION}:CHANGELOG.md" \
            | ESCAPED_VERSION="$ESCAPED_VERSION" awk '
                $0 ~ "^## v" ENVIRON["ESCAPED_VERSION"] "$" { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' \
            | awk '
                /[^[:space:]]/ { for (; blanks > 0; blanks--) print ""; print; started = 1; next }
                started { blanks++ }
              ' > dist/release-notes.md

          if [ ! -s dist/release-notes.md ]; then
            echo "::error::CHANGELOG.md in tag ${VERSION} has no notes under '## v${VERSION}'."
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: dist/smart-media-${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
